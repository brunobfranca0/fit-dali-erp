<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Fit DaLi Pedidos (Copy)</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<style>
/* Layout: ERP app shell — fixed left sidebar (collapses to a top bar under 1024px), page header, content on a cool off-white canvas.
   Visual language follows the Stripe DESIGN.md (navy ink, hairlines, pill buttons, thin display numerals, tabular money) with the Fit DaLi pink as the single CTA color. */
:root {
  --bg: #f6f9fc;
  --surface: #ffffff;
  --sunken: #f3f6fa;
  --ink: #0d253d;
  --ink-2: #273951;
  --muted: #64748d;
  --line: #e3e8ee;
  --line-input: #c5d3e2;
  --pink: #e60067;
  --pink-press: #c2185b;
  --pink-soft: #fdf2f7;
  --green: #38a149;
  --green-soft: #f0fdf4;
  --amber: #9b6829;
  --amber-soft: #fbf3e6;
  --red: #c8102e;
  --red-soft: #fdecee;
  --on-accent: #ffffff;
  --nav-active: #eef2f7;
  --scrim: rgba(13, 37, 61, .42);
  --shadow: 0 1px 3px rgba(0, 55, 112, .08);
  --shadow-2: 0 8px 24px rgba(0, 55, 112, .08), 0 2px 6px rgba(0, 55, 112, .04);
  /* chart series: categories in fixed order (validated light on #fff, dark on #111a2c) */
  --s1: #3b7a28; --s2: #d42a6f; --s3: #2a78d6; --bar: #8a96a8;
  --grid: #edf1f5; --axis: #d3dce6; --hover: rgba(13, 37, 61, .05);
  --f-display: "Inter", "SF Pro Display", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-body: "Inter", "SF Pro Text", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r-xs: 4px; --r-sm: 6px; --r-md: 8px; --r-lg: 12px; --r-pill: 9999px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b1220; --surface: #111a2c; --sunken: #0e1727; --ink: #e6edf5; --ink-2: #c4d0de; --muted: #8b9bb0;
    --line: #1f2b40; --line-input: #2c3b55;
    --pink: #ff5c9a; --pink-press: #ff7aae; --pink-soft: #3a1528; --green: #3ccf73; --green-soft: #12301f;
    --amber: #e0a755; --amber-soft: #33240f; --red: #ff6b7a; --red-soft: #3a1520; --on-accent: #1a0812;
    --nav-active: #18233a; --scrim: rgba(0, 0, 0, .6);
    --shadow: 0 1px 3px rgba(0, 0, 0, .35); --shadow-2: 0 8px 24px rgba(0, 0, 0, .4), 0 2px 6px rgba(0, 0, 0, .3);
    --s1: #4f9a37; --s2: #e8508c; --s3: #3987e5; --bar: #7d8ba0;
    --grid: #1a2538; --axis: #2a3850; --hover: rgba(255, 255, 255, .05);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b1220; --surface: #111a2c; --sunken: #0e1727; --ink: #e6edf5; --ink-2: #c4d0de; --muted: #8b9bb0;
  --line: #1f2b40; --line-input: #2c3b55;
  --pink: #ff5c9a; --pink-press: #ff7aae; --pink-soft: #3a1528; --green: #3ccf73; --green-soft: #12301f;
  --amber: #e0a755; --amber-soft: #33240f; --red: #ff6b7a; --red-soft: #3a1520; --on-accent: #1a0812;
  --nav-active: #18233a; --scrim: rgba(0, 0, 0, .6);
  --shadow: 0 1px 3px rgba(0, 0, 0, .35); --shadow-2: 0 8px 24px rgba(0, 0, 0, .4), 0 2px 6px rgba(0, 0, 0, .3);
  --s1: #4f9a37; --s2: #e8508c; --s3: #3987e5; --bar: #7d8ba0;
  --grid: #1a2538; --axis: #2a3850; --hover: rgba(255, 255, 255, .05);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 400 14px/1.45 var(--f-body); font-feature-settings: "ss01", "cv11"; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--pink); outline-offset: 2px; }
.num, .tbl td, .kpi b, .o-total b, .total b, .sum-row span:last-child { font-feature-settings: "tnum", "ss01"; font-variant-numeric: tabular-nums; }

/* shell */
.shell { display: grid; grid-template-columns: 232px minmax(0, 1fr); min-height: 100%; }
.side { position: sticky; top: env(safe-area-inset-top, 0px); height: calc(100vh - env(safe-area-inset-top, 0px)); background: var(--surface); border-right: 1px solid var(--line); display: flex; flex-direction: column; padding-block: 18px 14px; padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-right: 14px; overflow-y: auto; }
.brand { display: flex; align-items: center; gap: 10px; padding: 2px 8px 18px; }
.brand-mark { width: 32px; height: 32px; border-radius: var(--r-md); background: linear-gradient(135deg, #38a149, #e60067); color: var(--on-accent); display: grid; place-items: center; font-weight: 700; font-size: 13px; letter-spacing: -.02em; flex-shrink: 0; box-shadow: 0 2px 6px rgba(230,0,103,.2); }
.brand-title { display: flex; align-items: baseline; gap: 2px; }
.brand-fit { color: #38a149; font-weight: 800; font-size: 16px; letter-spacing: -0.3px; }
.brand-dali { color: #e60067; font-weight: 800; font-size: 16px; letter-spacing: -0.3px; }
.brand small { color: #2e7d32; font-size: 11px; font-weight: 500; font-style: italic; }
.tabs { display: flex; flex-direction: column; gap: 2px; }
.nav-sec { font-size: 11px; font-weight: 500; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding: 14px 10px 6px; }
.tab { display: flex; align-items: center; gap: 10px; border: 0; background: none; padding: 8px 10px; border-radius: var(--r-sm); font-weight: 500; font-size: 14px; color: var(--ink-2); cursor: pointer; white-space: nowrap; text-align: left; }
.tab svg { width: 18px; height: 18px; flex-shrink: 0; stroke: var(--muted); fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.tab:hover { background: var(--nav-active); }
.tab[aria-selected="true"] { background: var(--nav-active); color: var(--ink); font-weight: 600; }
.tab[aria-selected="true"] svg { stroke: var(--pink); }
.tab .count { margin-left: auto; min-width: 20px; padding: 0 6px; border-radius: var(--r-pill); background: var(--pink); color: var(--on-accent); font-size: 11px; font-weight: 600; line-height: 18px; text-align: center; }
.side-foot { margin-top: auto; padding: 14px 10px 0; font-size: 12px; color: var(--muted); border-top: 1px solid var(--line); }

main { min-width: 0; max-width: 1280px; width: 100%; padding-block: 28px 64px; padding-left: max(32px, env(safe-area-inset-left, 0px)); padding-right: max(32px, env(safe-area-inset-right, 0px)); }
.page-h { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 24px; }
.page-h h1 { margin: 0; font: 300 30px/1.1 var(--f-display); letter-spacing: -.7px; text-wrap: balance; }
.page-h p { margin: 6px 0 0; color: var(--muted); font-size: 14px; }
.banner { margin-bottom: 16px; padding: 10px 14px; border-radius: var(--r-md); background: var(--amber-soft); color: var(--amber); font-weight: 500; border: 1px solid color-mix(in srgb, var(--amber) 25%, transparent); }
h2 { font: 600 16px/1.3 var(--f-display); margin: 0; letter-spacing: -.2px; text-wrap: balance; }
h3 { font: 600 15px/1.3 var(--f-display); margin: 0; letter-spacing: -.1px; }
p { margin: 0; }
.label { font-size: 12px; font-weight: 500; color: var(--muted); }
.muted { color: var(--muted); }
.hint { font-size: 12px; color: var(--muted); }
.pos { color: var(--green); }
.neg { color: var(--red); }
.warn { color: var(--amber); }

/* forms */
.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field input, .field select, .field textarea, .inp { width: 100%; height: 36px; padding: 0 12px; border: 1px solid var(--line-input); border-radius: var(--r-sm); background: var(--surface); min-width: 0; transition: border-color .12s, box-shadow .12s; }
.field textarea { height: auto; min-height: 72px; padding: 8px 12px; resize: vertical; }
textarea.inp { height: auto; padding: 8px 12px; }
.field input:focus, .field select:focus, .field textarea:focus, .inp:focus { outline: none; border-color: var(--pink); box-shadow: 0 0 0 3px var(--pink-soft); }
.field input:disabled { background: var(--sunken); color: var(--muted); }
.check { display: flex; gap: 8px; align-items: center; font-weight: 500; cursor: pointer; }
.check input { width: 16px; height: 16px; accent-color: var(--pink); }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.seg { display: inline-flex; background: var(--sunken); border: 1px solid var(--line); border-radius: var(--r-pill); padding: 3px; gap: 2px; }
.seg button { flex: 1; border: 0; background: none; padding: 6px 14px; border-radius: var(--r-pill); font-weight: 500; font-size: 13px; color: var(--muted); cursor: pointer; white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.field .seg { display: flex; }

/* buttons: pills, 8px 16px */
.btn { border: 1px solid var(--line-input); background: var(--surface); padding: 7px 16px; border-radius: var(--r-pill); font-weight: 500; font-size: 14px; line-height: 20px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; text-decoration: none; color: var(--ink); white-space: nowrap; transition: background .12s, border-color .12s; }
.btn:hover { background: var(--sunken); }
.btn.primary { background: var(--pink); border-color: var(--pink); color: var(--on-accent); }
.btn.primary:hover { background: var(--pink-press); border-color: var(--pink-press); }
.btn.green { background: var(--ink); border-color: var(--ink); color: var(--surface); }
.btn.green:hover { opacity: .9; }
.btn.ghost { border-color: transparent; background: none; color: var(--ink-2); }
.btn.ghost:hover { background: var(--sunken); }
.btn.danger { color: var(--red); }
.btn.armed { background: var(--red); border-color: var(--red); color: #fff; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.big { width: 100%; padding: 11px 16px; font-size: 15px; }
.btn.sm { padding: 4px 12px; font-size: 13px; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }

/* surfaces */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 20px 24px; min-width: 0; box-shadow: var(--shadow); }
.stack { display: flex; flex-direction: column; gap: 14px; }
.head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
.cols2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; align-items: start; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 0; margin-bottom: 20px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--shadow); overflow: hidden; }
.kpi { padding: 16px 20px; min-width: 0; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); margin: 0 -1px -1px 0; }
.kpi .label { font-size: 13px; }
.kpi b { display: block; font: 300 26px/1.15 var(--f-display); letter-spacing: -.5px; margin-top: 6px; }
.kpi small { display: block; color: var(--muted); font-size: 12px; margin-top: 4px; }
.empty { padding: 40px 20px; text-align: center; border: 1px dashed var(--line-input); border-radius: var(--r-lg); color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 8px; background: var(--surface); }
.empty h3 { color: var(--ink); }
.empty p { max-width: 52ch; }
.empty.sm { padding: 20px; }

/* tables */
.tblw { overflow-x: auto; margin: 0 -4px; }
.tbl { width: 100%; border-collapse: collapse; font-size: 14px; }
.tbl th { text-align: left; font-size: 11px; font-weight: 500; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); padding: 8px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.tbl td { padding: 10px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.tbl tbody tr:hover td { background: var(--hover); }
.tbl tr:last-child td { border-bottom: 0; }
.tbl .r { text-align: right; white-space: nowrap; }
.tbl th.r { text-align: right; }
.tbl .big { font-weight: 500; }
.tbl tfoot td { border-top: 1px solid var(--ink); font-weight: 600; border-bottom: 0; }
.tbl tfoot tr:hover td { background: none; }
.tbl tr.zero td { color: var(--muted); }
.tbl .nm { font-weight: 500; }

/* status badges */
.pill { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: var(--r-pill); font-size: 12px; font-weight: 500; white-space: nowrap; line-height: 18px; }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.st-novo { background: var(--pink-soft); color: var(--pink); }
.st-preparo, .st-baixo { background: var(--amber-soft); color: var(--amber); }
.st-pronto, .st-ok { background: var(--green-soft); color: var(--green); }
.st-entregue { background: var(--sunken); color: var(--muted); }
.st-cancelado, .st-zerado { background: var(--red-soft); color: var(--red); }

/* novo pedido */
.work { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 20px; align-items: start; }
.cats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.cat { border-radius: var(--r-md); padding: 14px; background: var(--sunken); border: 1px solid var(--line); display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.cat-h { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.cat .cat-h h3 { display: flex; align-items: center; gap: 8px; }
.cat .cat-h h3::before { content: ""; width: 8px; height: 8px; border-radius: 2px; background: var(--s1); }
.cat.branco .cat-h h3::before { background: var(--s2); }
.cat.integral .cat-h h3::before { background: var(--s3); }
.cat-h .tot { font-weight: 600; font-size: 12px; padding: 1px 8px; border-radius: var(--r-pill); background: var(--surface); border: 1px solid var(--line); }
.cat .nota { font-size: 12px; color: var(--muted); margin-top: -6px; }
.flav { display: flex; align-items: center; gap: 8px; padding: 7px 0; border-top: 1px solid var(--line); }
.flav:first-child { border-top: 0; }
.flav .nm { flex: 1; min-width: 0; font-weight: 400; line-height: 1.3; color: var(--ink-2); }
.flav.on .nm { font-weight: 600; color: var(--ink); }
.step { display: flex; align-items: center; background: var(--surface); border: 1px solid var(--line-input); border-radius: var(--r-pill); flex-shrink: 0; }
.step button { width: 30px; height: 30px; border: 0; background: none; font-size: 16px; font-weight: 500; cursor: pointer; color: var(--muted); border-radius: var(--r-pill); }
.step button:hover { color: var(--pink); background: var(--pink-soft); }
.step input { width: 30px; text-align: center; border: 0; background: none; font-weight: 600; padding: 0; -moz-appearance: textfield; font-feature-settings: "tnum"; }
.step input::-webkit-inner-spin-button { -webkit-appearance: none; }
.flav.on .step { border-color: var(--pink); }
.sum { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 24px); }
.sum-lines { display: flex; flex-direction: column; gap: 6px; font-size: 14px; }
.sum-row { display: flex; justify-content: space-between; gap: 10px; }
.sum-row span:last-child { white-space: nowrap; }
.sum-cat { padding: 10px 0; border-bottom: 1px solid var(--line); }
.sum-cat .br { font-size: 12px; color: var(--muted); }
.save { color: var(--green); font-weight: 500; font-size: 12px; }
.total { display: flex; justify-content: space-between; align-items: baseline; padding-top: 12px; border-top: 1px solid var(--ink); }
.total b { font: 300 32px/1 var(--f-display); letter-spacing: -.8px; }
.empty-sum { padding: 20px; text-align: center; color: var(--muted); border: 1px dashed var(--line-input); border-radius: var(--r-md); }
.editing { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 8px 8px 8px 14px; background: var(--amber-soft); color: var(--amber); border-radius: var(--r-md); font-weight: 500; font-size: 14px; }

/* pedidos */
.bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; margin-bottom: 16px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line-input); background: var(--surface); padding: 5px 12px; border-radius: var(--r-pill); font-weight: 500; font-size: 13px; cursor: pointer; color: var(--ink-2); }
.chip:hover { background: var(--sunken); }
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--surface); }
.orders { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 16px; }
.order { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 16px 18px; display: flex; flex-direction: column; gap: 12px; min-width: 0; box-shadow: var(--shadow); }
.order.cancelado { opacity: .6; }
.order.cancelado .o-name { text-decoration: line-through; }
.o-head { display: flex; justify-content: space-between; gap: 10px; align-items: start; }
.o-code { font-size: 12px; font-weight: 500; color: var(--muted); letter-spacing: .04em; font-feature-settings: "tnum"; }
.o-name { font-weight: 600; font-size: 16px; letter-spacing: -.2px; margin-top: 4px; word-break: break-word; }
.o-total { text-align: right; flex-shrink: 0; }
.o-total b { font: 300 22px/1 var(--f-display); letter-spacing: -.4px; }
.o-meta { font-size: 13px; color: var(--muted); display: flex; flex-direction: column; gap: 2px; word-break: break-word; }
.o-items { margin: 0; padding: 10px 12px; list-style: none; background: var(--sunken); border: 1px solid var(--line); border-radius: var(--r-md); font-size: 13px; display: flex; flex-direction: column; gap: 4px; }
.o-items li { display: flex; gap: 8px; }
.o-items .q { font-weight: 600; min-width: 28px; font-feature-settings: "tnum"; }
.o-items .c { color: var(--muted); font-size: 12px; margin-left: auto; white-space: nowrap; }
.o-obs { font-size: 13px; padding: 8px 12px; background: var(--amber-soft); color: var(--ink); border-radius: var(--r-md); word-break: break-word; }
.o-actions { display: flex; flex-wrap: wrap; gap: 6px; padding-top: 12px; border-top: 1px solid var(--line); }
.o-actions .btn { padding: 4px 12px; font-size: 13px; }
.pay { font-size: 12px; font-weight: 500; margin-top: 6px; }
.pay.ok { color: var(--green); }
.pay.no { color: var(--amber); }

/* início */
.alerts { display: flex; flex-direction: column; gap: 8px; }
.alert { display: flex; gap: 10px; align-items: center; justify-content: space-between; padding: 8px 8px 8px 14px; border-radius: var(--r-md); background: var(--sunken); font-size: 14px; }
.alert.a-warn { background: var(--amber-soft); color: var(--amber); }
.alert.a-bad { background: var(--red-soft); color: var(--red); }
.alert.a-ok { background: var(--green-soft); color: var(--green); padding: 10px 14px; }
.list-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.list-row:last-child { border-bottom: 0; }
.list-row .nm { font-weight: 500; min-width: 0; overflow-wrap: anywhere; }

/* modal */
.modal { position: fixed; inset: 0; background: var(--scrim); z-index: 20; display: flex; align-items: flex-start; justify-content: center; overflow-y: auto; padding-block: calc(48px + env(safe-area-inset-top, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.modal-box { width: min(620px, 100%); background: var(--surface); border-radius: var(--r-lg); padding: 24px; box-shadow: var(--shadow-2); border: 1px solid var(--line); }
.m-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding-bottom: 14px; border-bottom: 1px solid var(--line); }
.m-head h2 { font-size: 18px; font-weight: 600; }
.m-foot { display: flex; justify-content: flex-end; align-items: center; gap: 10px; flex-wrap: wrap; padding-top: 14px; border-top: 1px solid var(--line); }
.m-foot .grow { margin-right: auto; }
.c-line { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr) minmax(0, 1fr) auto; gap: 8px; align-items: center; }
.m-rows { display: flex; flex-direction: column; max-height: 52vh; overflow-y: auto; border: 1px solid var(--line); border-radius: var(--r-md); padding: 4px 14px; }

<script>
const DEFAULT_MENU = {
  categorias: [
    { id: "lowcarb", nome: "Low carb", nota: "sem arroz · + seleta", preco: { un: 24.90, c10: 239, c20: 458 },
      sabores: ["Carne moída", "Frango cremoso", "Patinho de panela", "Patinho cremoso", "Strogonoff light de frango", "Strogonoff light de carne"] },
    { id: "branco", nome: "Arroz branco", nota: "arroz + seleta", preco: { un: 21.90, c10: 199, c20: 378 },
      sabores: ["Almôndegas", "Patinho de panela", "Patinho cremoso", "Frango cremoso", "Frango ao molho de laranja e gengibre", "Strogonoff light de frango", "Strogonoff light de carne"] },
    { id: "integral", nome: "Arroz integral", nota: "arroz integral + seleta", preco: { un: 22.90, c10: 219, c20: 418 },
      sabores: ["Carne moída", "Rocambole de frango"] }
  ]
};
const DEFAULT_EMPRESA = {
  nome: "Fit DaLi", slogan: "saudável com sabor!", documento: "", endereco: "", telefones: "35 98832-3788 · 35 98851-1608",
  cidade: "", pixTipo: "telefone", pixChave: "", pixNome: "", baixaAuto: true
};
const STATUS = [
  { id: "novo", nome: "Novo", prox: "Iniciar preparo" },
  { id: "preparo", nome: "Em preparo", prox: "Marcar pronto" },
  { id: "pronto", nome: "Pronto", prox: "Marcar entregue" },
  { id: "entregue", nome: "Entregue" },
  { id: "cancelado", nome: "Cancelado" }
];
const PAGAMENTOS = ["Pix", "Dinheiro", "Cartão", "A combinar"];
const UNIDADES = ["kg", "g", "L", "ml", "un", "pct", "cx"];
const INSUMO_CATS = ["Proteína", "Hortifruti", "Grãos e secos", "Temperos e molhos", "Embalagens", "Limpeza", "Outros"];
const DESPESA_CATS = ["Insumos", "Embalagens", "Gás e energia", "Entregas", "Aluguel", "Pessoal", "Marketing", "Impostos e taxas", "Outros"];
const RECEITA_CATS = ["Venda avulsa", "Outros"];
const COLS = ["pedidos", "clientes", "insumos", "movimentos", "lancamentos"];

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const clone = o => JSON.parse(JSON.stringify(o));
const r2 = v => Math.round(v * 100) / 100;
const r3 = v => Math.round(v * 1000) / 1000;
const brl = v => (v || 0).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
const qf = v => (v || 0).toLocaleString("pt-BR", { maximumFractionDigits: 3 });
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const isoDate = d => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
const hoje = () => isoDate(new Date());
const somaDias = n => { const d = new Date(); d.setDate(d.getDate() + n); return isoDate(d); };
const amanha = () => somaDias(1);
const mesAtual = () => hoje().slice(0, 7);
const fmtData = iso => {
  if (!iso) return "sem data";
  const [y, m, d] = iso.split("-").map(Number);
  return new Date(y, m - 1, d).toLocaleDateString("pt-BR", { weekday: "short", day: "2-digit", month: "2-digit" });
};
const fmtCurta = iso => iso ? iso.slice(8, 10) + "/" + iso.slice(5, 7) : "–";
const fmtMes = ym => { const [y, m] = ym.split("-").map(Number); return new Date(y, m - 1, 1).toLocaleDateString("pt-BR", { month: "long", year: "numeric" }); };
const num = v => { const n = parseFloat(String(v ?? "").replace(/\./g, (m, i, s) => s.includes(",") ? "" : ".").replace(",", ".")); return isFinite(n) ? n : 0; };
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const norm = s => (s || "").trim().toLowerCase();
const dig = s => (s || "").replace(/\D/g, "");
const ls = {
  get(k, f) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : f; } catch { return f; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};
const statusOf = id => STATUS.find(s => s.id === id) || STATUS[0];
const opts = (list, sel) => list.map(v => `<option ${v === sel ? "selected" : ""}>${esc(v)}</option>`).join("");

function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.hidden = false;
  clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, 2800);
}
function banner(msg) { const b = $("#banner"); b.textContent = msg; b.hidden = !msg; }

/* ---------- pricing ---------- */
function precoCategoria(q, p) {
  const c20 = Math.floor(q / 20), rest = q % 20, c10 = Math.floor(rest / 10), un = rest % 10;
  const total = r2(c20 * p.c20 + c10 * p.c10 + un * p.un);
  return { q, c20, c10, un, total, economia: r2(q * p.un - total) };
}
function calcular(qty, menu, taxa, desconto) {
  const linhas = [];
  let subtotal = 0, marmitas = 0;
  for (const c of menu.categorias) {
    let q = 0;
    for (const [k, v] of Object.entries(qty)) if (k.split("|")[0] === c.id) q += v;
    if (!q) continue;
    const p = precoCategoria(q, c.preco);
    linhas.push({ cat: c.id, catNome: c.nome, ...p });
    subtotal += p.total; marmitas += q;
  }
  subtotal = r2(subtotal);
  return { linhas, subtotal, marmitas, taxa: r2(taxa), desconto: r2(desconto), total: r2(Math.max(0, subtotal + taxa - desconto)) };
}
function breakdownText(l) {
  const parts = [];
  if (l.c20) parts.push(`${l.c20}× combo 20`);
  if (l.c10) parts.push(`${l.c10}× combo 10`);
  if (l.un) parts.push(`${l.un}× unitário`);
  return parts.join(" + ");
}

/* ---------- store: shared db when available, this browser otherwise ---------- */
const store = {
  mode: "loading", db: null,
  d: Object.fromEntries(COLS.map(c => [c, []])),
  menu: clone(DEFAULT_MENU), emp: clone(DEFAULT_EMPRESA),
  async init() {
    let db = null;
    try { db = window.claude && window.claude.use ? await window.claude.use("db") : null; } catch { db = null; }
    if (db) {
      this.db = db; this.mode = "db";
      COLS.forEach(c => db.collection(c).onSnapshot(s => {
        this.d[c] = s.docs.map(x => ({ ...x.data(), id: x.id }));
        changed(c);
      }, () => banner("A conexão com os dados caiu. Recarregue a página para reconectar.")));
      db.doc("config/cardapio").onSnapshot(s => {
        if (s.exists && Array.isArray(s.data().categorias)) this.menu = clone(s.data());
        changed("menu");
      }, () => {});
      db.doc("config/empresa").onSnapshot(s => {
        if (s.exists) this.emp = { ...clone(DEFAULT_EMPRESA), ...clone(s.data()) };
        changed("emp");
      }, () => {});
    } else {
      this.mode = "local";
      COLS.forEach(c => this.d[c] = ls.get("fd_" + c, []));
      const m = ls.get("fd_menu", null); if (m) this.menu = m;
      const e = ls.get("fd_emp", null); if (e) this.emp = { ...clone(DEFAULT_EMPRESA), ...e };
      banner("Modo offline: os dados ficam salvos só neste navegador. Abra pelo link do Claude para compartilhar com a equipe.");
      changed("all");
    }
  },
  async put(col, id, body) {
    const { id: _ignore, ...b } = body;
    if (this.mode === "db") return this.db.doc(col + "/" + id).set(b);
    const a = this.d[col], i = a.findIndex(x => x.id === id);
    if (i >= 0) a[i] = { ...b, id }; else a.push({ ...b, id });
    this.persist(col);
  },
  async patch(col, id, p) {
    if (this.mode === "db") return this.db.doc(col + "/" + id).update(p);
    const o = this.d[col].find(x => x.id === id); if (o) { Object.assign(o, p); this.persist(col); }
  },
  async del(col, id) {
    if (this.mode === "db") return this.db.doc(col + "/" + id).delete();
    this.d[col] = this.d[col].filter(x => x.id !== id); this.persist(col);
  },
  async setConfig(name, body) {
    if (this.mode === "db") return this.db.doc("config/" + name).set(body);
    if (name === "cardapio") { this.menu = body; ls.set("fd_menu", body); changed("menu"); }
    else { this.emp = { ...clone(DEFAULT_EMPRESA), ...body }; ls.set("fd_emp", body); changed("emp"); }
  },
  persist(col) { ls.set("fd_" + col, this.d[col]); changed(col); }
};
async function guard(fn, okMsg) {
  try { await fn(); if (okMsg) toast(okMsg); return true; }
  catch (e) {
    const code = e && e.code;
    if (code === "invalid_argument") toast("Você não tem permissão para alterar os dados neste link.");
    else if (code === "quota_exceeded") toast("O armazenamento está cheio. Exclua registros antigos.");
    else toast("Não foi possível salvar. Verifique a conexão e tente de novo.");
    return false;
  }
}

/* ---------- derived data ---------- */
function menuItens() {
  const out = [];
  store.menu.categorias.forEach(c => c.sabores.forEach(s => out.push({ id: c.id + "|" + s, cat: c.id, catNome: c.nome, sabor: s, nome: `${s} (${c.nome})` })));
  return out;
}
function saldos(alvo) {
  const s = {};
  for (const m of store.d.movimentos) if (m.alvo === alvo) for (const l of m.linhas || []) s[l.id] = r3((s[l.id] || 0) + (l.qtd || 0));
  return s;
}
const usaEstoqueMarmitas = () => store.d.movimentos.some(m => m.alvo === "marmita" && m.tipo !== "baixa");
function statusInsumo(i, saldo) { return saldo <= 0 ? "zerado" : (i.minimo && saldo < i.minimo ? "baixo" : "ok"); }
const pedidosValidos = () => store.d.pedidos.filter(o => o.status !== "cancelado");
const aReceber = () => pedidosValidos().filter(o => !o.pago);

/* ---------- tabs & rendering ---------- */
const TABS = ["inicio", "novo", "pedidos", "producao", "estoque", "financeiro", "relatorios", "clientes", "ajustes"];
let tab = ls.get("fd_tab2", "inicio");
if (!TABS.includes(tab)) tab = "inicio";
const TITULOS = {
  inicio: ["Início", () => fmtData(hoje()).replace(/^./, c => c.toUpperCase()) + " · resumo do dia"],
  novo: ["Novo pedido", () => "Combos de 10 e 20 são aplicados automaticamente por categoria"],
  pedidos: ["Pedidos", () => "Acompanhe o preparo, registre pagamentos e emita a nota"],
  producao: ["Produção", () => "O que preparar e o roteiro de entregas do dia"],
  estoque: ["Estoque", () => "Insumos, embalagens e marmitas prontas"],
  financeiro: ["Financeiro", () => "Entradas, saídas, contas a pagar e a receber"],
  relatorios: ["Relatórios", () => "Vendas, sabores, clientes e resultado do período"],
  clientes: ["Clientes", () => "Cadastro e histórico de compras"],
  ajustes: ["Ajustes", () => "Dados da empresa, Pix, cardápio e backup"]
};
function showTab(t) {
  tab = t; ls.set("fd_tab2", t);
  $("#page-title").textContent = TITULOS[t][0];

      <div class="kpi"><span class="label">A receber</span><b class="warn">${brl(totReceber)}</b><small>${receber.length} pedido${receber.length === 1 ? "" : "s"} pendente${receber.length === 1 ? "" : "s"}</small></div>
    </div>
    <div class="cols2">
      <div class="panel stack">
        <div class="cat-h"><h3>Entregas e retiradas de hoje</h3><button class="btn sm" data-goto="pedidos">Ver pedidos</button></div>
        ${doDia.length ? `<div>${doDia.sort((a, b) => (a.horario || "").localeCompare(b.horario || "")).map(o => `
          <div class="list-row"><span class="nm">${esc(o.cliente)}<br><span class="hint">${o.horario ? esc(o.horario) + " · " : ""}${o.modo === "retirada" ? "Retirada" : "Entrega"} · ${o.marmitas} marmitas</span></span>
          <span style="text-align:right"><span class="pill st-${esc(o.status)}">${statusOf(o.status).nome}</span><br><span class="num hint">${brl(o.total)}</span></span></div>`).join("")}</div>`
        : `<div class="empty sm">Nenhum pedido com entrega hoje.<button class="btn primary sm" data-goto="novo">Lançar pedido</button></div>`}
      </div>
      <div class="stack">
        <div class="panel stack">
          <h3>Atenção</h3>

            : `<div class="alert a-ok">Tudo em dia: estoque acima do mínimo e nenhuma conta vencendo.</div>`}</div>

function novoCodigo() {

async function upsertCliente(o) {
  const cs = store.d.clientes;
  const c = cs.find(c => c.id === o.clienteId) || (dig(o.telefone) && cs.find(c => dig(c.telefone) === dig(o.telefone))) || cs.find(c => norm(c.nome) === norm(o.cliente));
  if (!c) {
    const id = uid("c");
    await store.put("clientes", id, { nome: o.cliente, telefone: o.telefone, endereco: o.endereco, obs: "", criadoEm: new Date().toISOString() });
    return id;
  }
  const p = {};
  if (o.telefone && o.telefone !== c.telefone) p.telefone = o.telefone;
  if (o.endereco && o.endereco !== c.endereco) p.endereco = o.endereco;
  if (Object.keys(p).length) await store.patch("clientes", c.id, p);
  return c.id;
}
async function salvarPedido(btn) {

function pixChaveFormatada() {
  const e = store.emp, k = (e.pixChave || "").trim();
  if (!k) return "";
  if (e.pixTipo === "telefone") { let d = dig(k); if (d.startsWith("55") && d.length >= 12) d = d.slice(2); return "+55" + d; }
  if (e.pixTipo === "documento") return dig(k);
  if (e.pixTipo === "email") return k.toLowerCase();
  return k;
}
function crc16(s) {
  let c = 0xFFFF;
  for (let i = 0; i < s.length; i++) { c ^= s.charCodeAt(i) << 8; for (let j = 0; j < 8; j++) c = (c & 0x8000) ? ((c << 1) ^ 0x1021) : (c << 1); c &= 0xFFFF; }
  return c.toString(16).toUpperCase().padStart(4, "0");
}
function pixPayload({ chave, nome, cidade, valor, txid }) {
  const f = (id, v) => id + String(v.length).padStart(2, "0") + v;
  const clean = (s, n) => (s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^A-Za-z0-9 ]/g, "").toUpperCase().trim().slice(0, n);
  const p = f("00", "01") + f("26", f("00", "br.gov.bcb.pix") + f("01", chave)) + f("52", "0000") + f("53", "986")
    + (valor > 0 ? f("54", valor.toFixed(2)) : "") + f("58", "BR") + f("59", clean(nome, 25) || "FIT DALI") + f("60", clean(cidade, 15) || "BRASIL")
    + f("62", f("05", (txid || "").replace(/[^A-Za-z0-9]/g, "").slice(0, 25) || "***")) + "6304";
  return p + crc16(p);
}
function pixPayloadPedido(o) {
  const chave = pixChaveFormatada();
  if (!chave || !(o.total > 0)) return "";
  return pixPayload({ chave, nome: store.emp.pixNome || store.emp.nome, cidade: store.emp.cidade, valor: o.total, txid: "FD" + o.codigo });
}

function notaCanvas(o) {
  const W = 576, pad = 26, FS = 21, LH = 29, maxW = W - pad * 2;
  const c = document.createElement("canvas"), x = c.getContext("2d");
  const font = (b, s) => `${b ? "bold " : ""}${Math.round(FS * (s || 1))}px "Courier New", Courier, monospace`;
  const wrap = (txt, f, w) => {
    x.font = f; const out = []; let cur = "";
    for (const word of String(txt).split(/\s+/)) {
      const t = cur ? cur + " " + word : word;
      if (x.measureText(t).width > w && cur) { out.push(cur); cur = word; } else cur = t;
    }
    out.push(cur); return out;
  };
  const ops = []; let y = pad;
  for (const ln of notaLinhas(o)) {
    if (ln.hr) { ops.push({ hr: 1, y: y + LH / 2 }); y += LH; continue; }
    const f = font(ln.b, ln.s), h = Math.round(LH * (ln.s || 1));
    if (ln.t != null) { wrap(ln.t, f, maxW).forEach(w => { ops.push({ t: w, f, a: ln.a || "l", y: y + h * .75 }); y += h; }); continue; }
    x.font = f;
    const rw = ln.r ? x.measureText(ln.r).width + 14 : 0;
    if (rw > maxW * .62) {
      wrap(ln.l, f, maxW).forEach(w => { ops.push({ t: w, f, a: "l", y: y + h * .75 }); y += h; });
      wrap(ln.r, f, maxW).forEach(w => { ops.push({ t: w, f, a: "r", y: y + h * .75 }); y += h; });
    } else {
      wrap(ln.l, f, maxW - rw).forEach((w, i) => { ops.push({ t: w, f, a: "l", y: y + h * .75 }); if (i === 0 && ln.r) ops.push({ t: ln.r, f, a: "r", y: y + h * .75 }); y += h; });
    }
  }
  const pix = !o.pago && pixPayloadPedido(o);
  let qr = null;
  if (pix && typeof qrcode === "function") {
    try { qr = qrcode(0, "M"); qr.addData(pix); qr.make(); } catch { qr = null; }
    if (qr) {
      ops.push({ t: "Pague com Pix", f: font(1, 1.1), a: "c", y: y + LH * .9 }); y += LH * 1.3;
      ops.push({ qr: 1, y }); y += 300;
      ops.push({ t: "Aponte a câmera do app do banco", f: font(0, .85), a: "c", y: y + LH * .7 }); y += LH;
    }
  }
  c.width = W; c.height = Math.ceil(y + pad);
  x.fillStyle = "#ffffff"; x.fillRect(0, 0, c.width, c.height);
  x.fillStyle = "#111111"; x.strokeStyle = "#111111";
  for (const op of ops) {
    if (op.hr) { x.setLineDash([6, 5]); x.lineWidth = 2; x.beginPath(); x.moveTo(pad, op.y); x.lineTo(W - pad, op.y); x.stroke(); x.setLineDash([]); continue; }
    if (op.qr) {
      const n = qr.getModuleCount(), cell = Math.floor(280 / n), size = cell * n, ox = Math.round((W - size) / 2);
      for (let r = 0; r < n; r++) for (let col = 0; col < n; col++) if (qr.isDark(r, col)) x.fillRect(ox + col * cell, op.y + r * cell, cell, cell);
      continue;
    }
    x.font = op.f; x.textAlign = op.a === "c" ? "center" : op.a === "r" ? "right" : "left";
    x.fillText(op.t, op.a === "c" ? W / 2 : op.a === "r" ? W - pad : pad, op.y);
  }
  return c;
}

/* ---------- relatórios ---------- */
const sum = (a, f) => r2(a.reduce((s, x) => s + (f(x) || 0), 0));
const addDias = (iso, n) => { const [y, m, d] = iso.split("-").map(Number); return isoDate(new Date(y, m - 1, d + n)); };
const diasEntre = (a, b) => Math.round((new Date(b + "T12:00") - new Date(a + "T12:00")) / 864e5);
const inicioSemana = iso => { const [y, m, d] = iso.split("-").map(Number); const dt = new Date(y, m - 1, d); dt.setDate(dt.getDate() - (dt.getDay() + 6) % 7); return isoDate(dt); };
const compacto = v => v >= 1000 ? (v / 1000).toLocaleString("pt-BR", { maximumFractionDigits: 1 }) + " mil" : v.toLocaleString("pt-BR", { maximumFractionDigits: 0 });
const PRESETS = [["7d", "7 dias"], ["30d", "30 dias"], ["mes", "Este mês"], ["mesant", "Mês passado"], ["90d", "90 dias"], ["ano", "Este ano"]];
let rel = Object.assign({ p: "30d", de: addDias(hoje(), -29), ate: hoje() }, ls.get("fd_rel", {}));
function periodo() {
  const h = hoje(), d = new Date();
  if (rel.p === "7d") return [addDias(h, -6), h];
  if (rel.p === "30d") return [addDias(h, -29), h];
  if (rel.p === "90d") return [addDias(h, -89), h];
  if (rel.p === "mes") return [h.slice(0, 7) + "-01", isoDate(new Date(d.getFullYear(), d.getMonth() + 1, 0))];
  if (rel.p === "mesant") return [isoDate(new Date(d.getFullYear(), d.getMonth() - 1, 1)), isoDate(new Date(d.getFullYear(), d.getMonth(), 0))];
  if (rel.p === "ano") return [h.slice(0, 4) + "-01-01", h];
  return rel.de <= rel.ate ? [rel.de, rel.ate] : [rel.ate, rel.de];
}
function relStats(de, ate) {
  const all = store.d.pedidos.filter(o => o.data >= de && o.data <= ate);
  const os = all.filter(o => o.status !== "cancelado");
  const fat = sum(os, o => o.total);
  return { all, os, canc: all.length - os.length, fat, marm: sum(os, o => o.marmitas), pedidos: os.length,
    ticket: os.length ? r2(fat / os.length) : 0, clientes: new Set(os.map(o => o.clienteId || norm(o.cliente))).size };
}
function delta(cur, prev) {
  if (!prev) return `<small>sem dados no período anterior</small>`;
  const p = Math.round((cur - prev) / prev * 100);
  return `<small><span class="delta ${p >= 0 ? "up" : "down"}">${p >= 0 ? "▲" : "▼"} ${Math.abs(p)}%</span> vs período anterior</small>`;
}
const catCor = id => ({ lowcarb: "var(--s1)", branco: "var(--s2)", integral: "var(--s3)" })[id] || "var(--bar)";
let tipData = [], relCharts = {};

function renderRelatorios() {
  const [de, ate] = periodo(), nd = diasEntre(de, ate) + 1;
  const cur = relStats(de, ate), prev = relStats(addDias(de, -nd), addDias(de, -1));
  const os = cur.os, cats = store.menu.categorias;
  tipData = []; relCharts = {};

  const primeira = {};
  pedidosValidos().forEach(o => { const k = o.clienteId || norm(o.cliente); if (!primeira[k] || o.data < primeira[k]) primeira[k] = o.data; });
  const novos = Object.values(primeira).filter(d => d >= de && d <= ate).length;
  const pagoPct = cur.fat ? Math.round(sum(os.filter(o => o.pago), o => o.total) / cur.fat * 100) : 0;

  // vendas por dia/semana, empilhado por categoria
  const semanal = nd > 45, buckets = [], idx = {};
  for (let k = semanal ? inicioSemana(de) : de; k <= ate; k = addDias(k, semanal ? 7 : 1)) {
    idx[k] = buckets.length;
    buckets.push({ key: k, label: fmtCurta(k), values: cats.map(() => 0), pedidos: 0, total: 0 });
  }
  os.forEach(o => {
    const b = buckets[idx[semanal ? inicioSemana(o.data) : o.data]]; if (!b) return;
    b.pedidos++; b.total = r2(b.total + o.total);
    (o.linhas || []).forEach(l => { const i = cats.findIndex(c => c.id === l.cat); if (i >= 0) b.values[i] = r2(b.values[i] + l.total); });
  });
  buckets.forEach(b => b.tip = { title: semanal ? `Semana de ${fmtCurta(b.key)}` : fmtData(b.key),
    rows: cats.map((c, i) => ({ color: catCor(c.id), label: c.nome, value: brl(b.values[i]) })),
    foot: `${b.pedidos} pedido${b.pedidos === 1 ? "" : "s"} · ${brl(b.total)} com taxas e descontos` });
  relCharts["ch-vendas"] = { title: "Vendas por " + (semanal ? "semana" : "dia"), buckets, series: cats.map(c => ({ nome: c.nome, color: catCor(c.id) })), fmtAxis: compacto };

  // dia da semana
  const DS = ["Seg", "Ter", "Qua", "Qui", "Sex", "Sáb", "Dom"], wk = DS.map(l => ({ label: l, values: [0], pedidos: 0 }));
  os.forEach(o => { const [y, m, d] = o.data.split("-").map(Number); const w = wk[(new Date(y, m - 1, d).getDay() + 6) % 7]; w.values[0] += o.marmitas || 0; w.pedidos++; });
  wk.forEach((w, i) => w.tip = { title: ["Segunda", "Terça", "Quarta", "Quinta", "Sexta", "Sábado", "Domingo"][i], rows: [{ color: "var(--bar)", label: "Marmitas", value: String(w.values[0]) }], foot: `${w.pedidos} pedido${w.pedidos === 1 ? "" : "s"} no período` });
  relCharts["ch-semana"] = { title: "Marmitas por dia da semana", buckets: wk, series: [{ nome: "Marmitas", color: "var(--bar)" }], fmtAxis: v => String(Math.round(v)) };

  // categorias e sabores
  const porCat = cats.map(c => ({ c, q: 0, v: 0 }));

function niceMax(v) {
  if (v <= 0) return 4;
  const raw = v / 4, p = Math.pow(10, Math.floor(Math.log10(raw)));

}
const roundTop = (x, y, w, h, r) => `M${x},${y + h}V${y + r}Q${x},${y} ${x + r},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h}Z`;
function svgColumns(el, spec) {
  const W = Math.max(260, el.clientWidth), H = el.id === "ch-semana" ? 200 : 240, padL = 48, padR = 6, padT = 10, padB = 24;
  const n = spec.buckets.length, iw = W - padL - padR, ih = H - padT - padB, slot = iw / n;
  const bw = Math.min(24, Math.max(2, slot * 0.62));
  const max = niceMax(Math.max(0, ...spec.buckets.map(b => b.values.reduce((a, v) => a + v, 0))));
  const y = v => padT + ih - v / max * ih;
  let s = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="${esc(spec.title)}">`;
  [0, .25, .5, .75, 1].forEach(f => {
    const t = max * f, yy = Math.round(y(t)) + .5;
    s += `<line x1="${padL}" x2="${W - padR}" y1="${yy}" y2="${yy}" class="${f ? "grid" : "axis"}"/><text x="${padL - 8}" y="${yy + 4}" class="tick" text-anchor="end">${esc(spec.fmtAxis(t))}</text>`;
  });
  const every = Math.ceil(n / Math.max(1, Math.floor(iw / 46)));
  spec.buckets.forEach((b, i) => {
    const cx = padL + slot * i + slot / 2, x = cx - bw / 2;
    const segs = b.values.map((v, si) => ({ v, si })).filter(g => g.v > 0);
    let acc = 0;
    segs.forEach((g, k) => {
      const y0 = y(acc), y1 = y(acc + g.v); acc += g.v;
      const top = k === segs.length - 1, yy = y1 + (top ? 0 : 1), hh = Math.max(0, y0 - (k ? 1 : 0) - yy);
      if (hh <= 0) return;
      s += top ? `<path d="${roundTop(x, yy, bw, hh, Math.min(4, hh, bw / 2))}" style="fill:${spec.series[g.si].color}"/>`
        : `<rect x="${x}" y="${yy}" width="${bw}" height="${hh}" style="fill:${spec.series[g.si].color}"/>`;
    });
    if (i % every === 0) s += `<text x="${cx}" y="${H - 6}" class="tick" text-anchor="middle">${esc(b.label)}</text>`;
    const id = tipData.push(b.tip) - 1;
    s += `<rect class="hit" x="${padL + slot * i}" y="${padT}" width="${slot}" height="${ih}" data-tip="${id}" tabindex="0"/>`;
  });
  return s + "</svg>";
}

function marcarAj() { if (!ajDirty) { ajDirty = true; const b = $("[data-j=salvar]"); if (b) b.disabled = false; } }
const vAj = $("#view-ajustes");
vAj.addEventListener("input", e => {
  const t = e.target;
  if (t.dataset.emp) { empEd[t.dataset.emp] = t.type === "checkbox" ? t.checked : t.value; marcarAj(); return; }
  const ci = t.dataset.ci; if (ci == null) return;
  if (t.dataset.p) menuEd.categorias[ci].preco[t.dataset.p] = num(t.value);
  else if (t.dataset.si != null) menuEd.categorias[ci].sabores[t.dataset.si] = t.value.replace(/\|/g, "");
  marcarAj();
});
vAj.addEventListener("change", e => { if (e.target.dataset.emp) { empEd[e.target.dataset.emp] = e.target.type === "checkbox" ? e.target.checked : e.target.value; marcarAj(); } });
vAj.addEventListener("keydown", e => { if (e.key === "Enter" && e.target.dataset.new != null) { e.preventDefault(); addSabor(+e.target.dataset.new); } });
function addSabor(ci) {
  const s = $("#m-" + ci + "-novo").value.trim().replace(/\|/g, "");
  if (!s) return;
  menuEd.categorias[ci].sabores.push(s); ajDirty = true; drawAjustes(); $("#m-" + ci + "-novo").focus();
}
vAj.addEventListener("click", async e => {
  const b = e.target.closest("[data-j]"); if (!b) return;
  const j = b.dataset.j;
  if (j === "add") addSabor(+b.dataset.ci);
  if (j === "rm") { menuEd.categorias[b.dataset.ci].sabores.splice(+b.dataset.si, 1); ajDirty = true; drawAjustes(); }
  if (j === "padrao") { menuEd = clone(DEFAULT_MENU); ajDirty = true; drawAjustes(); }
  if (j === "backup") {
    const data = { exportadoEm: new Date().toISOString(), empresa: store.emp, cardapio: store.menu, ...store.d };
    await baixar(`fitdali-backup-${hoje()}.json`, JSON.stringify(data, null, 2));
  }
  if (j === "salvar") {
    menuEd.categorias.forEach(c => c.sabores = c.sabores.map(s => s.trim()).filter((s, i, a) => s && a.indexOf(s) === i));
    b.disabled = true;
    const ok = await guard(async () => { await store.setConfig("cardapio", clone(menuEd)); await store.setConfig("empresa", clone(empEd)); }, "Ajustes salvos");
    if (ok) { store.menu = clone(menuEd); store.emp = { ...clone(DEFAULT_EMPRESA), ...clone(empEd) }; ajDirty = false; renderAjustes(true); }
    else b.disabled = false;
  }
});

let mctx = null;
const modalHead = t => `<div class="m-head"><h2>${t}</h2><button type="button" class="btn ghost" data-x="close">Fechar</button></div>`;
function openModal(kind, html, ctx = {}) {
  mctx = { kind, ...ctx };

  $("#modal").hidden = false;
  const f = $("#modal-body [autofocus]"); if (f) f.focus();
}
function closeModal() { $("#modal").hidden = true; $("#modal-body").innerHTML = ""; mctx = null; }
document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("#modal").hidden) closeModal(); });
$("#modal").addEventListener("click", async e => {
  if (e.target.id === "modal") { closeModal(); return; }
  const b = e.target.closest("[data-x]"); if (!b) return;
  const x = b.dataset.x;
  if (x === "close") closeModal();
  if (x === "add-linha") $("#c-lines").insertAdjacentHTML("beforeend", linhaCompra());
  if (x === "rm-linha") { if ($$("#c-lines .c-line").length > 1) b.closest(".c-line").remove(); totalCompra(); }

  if (x === "tipo") {
    mctx.tipo = b.dataset.v;
    $$("[data-x=tipo]").forEach(t => t.setAttribute("aria-pressed", t === b));
    $("#l-cat").innerHTML = opts(mctx.tipo === "receita" ? RECEITA_CATS : DESPESA_CATS);
    $("#l-pago-txt").textContent = mctx.tipo === "receita" ? "Já recebida" : "Já está paga";

  if (x === "del") {
    if (!b.classList.contains("armed")) { b.classList.add("armed"); b.textContent = "Confirmar exclusão"; return; }
    const col = mctx.kind === "insumo" ? "insumos" : "clientes";
    if (await guard(() => store.del(col, mctx.id), "Excluído")) closeModal();
  }
});
$("#modal").addEventListener("input", e => { if (mctx && mctx.kind === "compra") totalCompra(); });
$("#modal").addEventListener("submit", async e => {

});

const novoMov = (tipo, alvo, data, linhas, obs, extra = {}) => ({ tipo, alvo, data: data || hoje(), criadoEm: new Date().toISOString(), obs: obs || "", linhas, ...extra });
const SUBMIT = {
  async insumo(fd) {
    const id = mctx.id || uid("i"), nome = fd.get("nome").trim();
    const body = { nome, unidade: fd.get("unidade"), categoria: fd.get("categoria"), minimo: num(fd.get("minimo")), custoUnit: num(fd.get("custoUnit")) };
    const ini = num(fd.get("inicial"));
    return guard(async () => {
      await store.put("insumos", id, mctx.id ? { ...store.d.insumos.find(x => x.id === id), ...body } : { ...body, criadoEm: new Date().toISOString() });
      if (ini) await store.put("movimentos", uid("m"), novoMov("ajuste", "insumo", hoje(), [{ id, nome, qtd: ini }], "Estoque inicial"));
    }, mctx.id ? "Insumo atualizado" : "Insumo cadastrado");
  },
  async compra(fd) {
    const ins = fd.getAll("ins"), qs = fd.getAll("qtd"), vs = fd.getAll("valor");
    const linhas = ins.map((id, i) => { const it = store.d.insumos.find(x => x.id === id); return { id, nome: it ? it.nome : id, qtd: num(qs[i]), valor: r2(num(vs[i])) }; }).filter(l => l.qtd > 0);
    if (!linhas.length) { toast("Informe a quantidade de pelo menos um item."); return false; }
    const total = r2(linhas.reduce((s, l) => s + l.valor, 0)), forn = fd.get("fornecedor").trim(), data = fd.get("data") || hoje();
    const movId = uid("m");
    return guard(async () => {
      await store.put("movimentos", movId, novoMov("compra", "insumo", data, linhas, forn, { valor: total }));
      for (const l of linhas) if (l.valor > 0) await store.patch("insumos", l.id, { custoUnit: r2(l.valor / l.qtd) });
      if (fd.get("lancar") && total > 0) await store.put("lancamentos", uid("l"), { tipo: "despesa", descricao: "Compra" + (forn ? " · " + forn : ""), categoria: linhas.every(l => (store.d.insumos.find(x => x.id === l.id) || {}).categoria === "Embalagens") ? "Embalagens" : "Insumos", valor: total, data, pago: !!fd.get("pago"), movimentoId: movId, criadoEm: new Date().toISOString() });
    }, `Entrada registrada · ${brl(total)}`);
  },
  async saida(fd) {
    const it = store.d.insumos.find(x => x.id === fd.get("ins")), q = num(fd.get("qtd"));
    if (!it || q <= 0) { toast("Informe a quantidade."); return false; }
    return guard(() => store.put("movimentos", uid("m"), novoMov(fd.get("motivo"), "insumo", fd.get("data"), [{ id: it.id, nome: it.nome, qtd: -q }], fd.get("obs"))), `Saída de ${qf(q)} ${it.unidade} registrada`);
  },
  async contagem(fd) {
    const cs = fd.getAll("c"), linhas = [];
    mctx.items.forEach((it, i) => { if (String(cs[i]).trim() === "") return; const diff = r3(num(cs[i]) - (mctx.sal[it.id] || 0)); if (diff) linhas.push({ id: it.id, nome: it.nome, qtd: diff }); });
    if (!linhas.length) { toast("Nenhuma diferença para ajustar."); return true; }
    return guard(() => store.put("movimentos", uid("m"), novoMov("ajuste", mctx.alvo, hoje(), linhas, "Contagem de estoque")), `${linhas.length} item(ns) ajustado(s)`);
  },
  async producao(fd) {
    const linhas = $$("#modal [name=q]").map(i => { const k = i.dataset.k, p = k.indexOf("|"), c = store.menu.categorias.find(x => x.id === k.slice(0, p)); return { id: k, nome: `${k.slice(p + 1)} (${c ? c.nome : ""})`, qtd: Math.floor(num(i.value)) }; }).filter(l => l.qtd > 0);
    if (!linhas.length) { toast("Informe quantas marmitas ficaram prontas."); return false; }
    const tot = linhas.reduce((s, l) => s + l.qtd, 0);
    return guard(() => store.put("movimentos", uid("m"), novoMov("producao", "marmita", fd.get("data"), linhas, `${tot} marmitas`)), `${tot} marmitas adicionadas ao estoque`);
  },
  async lancamento(fd) {
    const v = r2(num(fd.get("valor")));
    if (v <= 0) { toast("Informe um valor maior que zero."); return false; }
    const id = mctx.id || uid("l");
    const body = { ...(mctx.id ? mctx.orig : { criadoEm: new Date().toISOString() }), tipo: mctx.tipo, descricao: fd.get("descricao").trim(), categoria: fd.get("categoria"), valor: v, data: fd.get("data") || hoje(), pago: !!fd.get("pago") };
    return guard(() => store.put("lancamentos", id, body), mctx.id ? "Lançamento atualizado" : "Lançamento salvo");
  },
  async cliente(fd) {
    const id = mctx.id || uid("c");
    const body = { ...(mctx.id ? store.d.clientes.find(x => x.id === id) : { criadoEm: new Date().toISOString() }), nome: fd.get("nome").trim(), telefone: fd.get("telefone").trim(), endereco: fd.get("endereco").trim(), obs: fd.get("obs").trim() };
    return guard(() => store.put("clientes", id, body), mctx.id ? "Cliente atualizado" : "Cliente cadastrado");
  }
};

showTab(tab);
store.init();
</script>
