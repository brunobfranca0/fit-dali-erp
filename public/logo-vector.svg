<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 150" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&amp;family=Caveat:wght@700&amp;family=Montserrat:ital,wght@1,500&amp;display=swap');
      .fit-text {
        font-family: 'Dancing Script', 'Brush Script MT', cursive;
        font-size: 58px;
        font-weight: 700;
        fill: #3ba43e;
      }
      .dali-text {
        font-family: 'Caveat', 'Dancing Script', cursive;
        font-size: 82px;
        font-weight: 700;
        fill: #2e7d32;
      }
      .tagline {
        font-family: 'Montserrat', system-ui, sans-serif;
        font-size: 13.5px;
        font-weight: 500;
        font-style: italic;
        fill: #2d5a27;
        letter-spacing: 0.5px;
      }
    </style>
    <!-- Filter for subtle depth -->
    <filter id="vector-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-opacity="0.12" flood-color="#000"/>
    </filter>
  </defs>

  <g filter="url(#vector-shadow)">
    <!-- Leaf sprouting on the 'D' -->
    <g transform="translate(138, 22) rotate(-15) scale(0.95)">
      <!-- Stem -->
      <path d="M 2 18 C 3 10, 8 4, 15 2" fill="none" stroke="#2e7d32" stroke-width="2" stroke-linecap="round"/>
      <!-- Main leaf -->
      <path d="M 12 3 C 22 -4, 30 2, 28 14 C 20 18, 14 12, 12 3 Z" fill="#43a047"/>
      <!-- Inner leaf vein -->
      <path d="M 14 5 C 19 6, 23 9, 25 12" fill="none" stroke="#a5d6a7" stroke-width="1.2" stroke-linecap="round"/>
      <!-- Small secondary leaf -->
      <path d="M 6 12 C 4 3, -4 4, -4 10 C -2 14, 3 15, 6 12 Z" fill="#66bb6a"/>
    </g>

    <!-- 'Fit' word -->
    <text x="25" y="80" class="fit-text">Fit</text>

    <!-- Leaf replacing dot of 'i' in Fit -->
    <g transform="translate(68, 40) rotate(-10) scale(0.65)">
      <path d="M 2 12 C 8 2, 16 2, 18 10 C 14 16, 6 16, 2 12 Z" fill="#3ba43e"/>
      <path d="M -3 14 C -6 7, -1 5, 2 10 C 1 14, -1 15, -3 14 Z" fill="#66bb6a"/>
    </g>

    <!-- 'DaLi' word -->
    <text x="115" y="86" class="dali-text">DaLi</text>

    <!-- Tagline underneath -->
    <text x="32" y="118" class="tagline">saudável com sabor!</text>
  </g>
</svg>
